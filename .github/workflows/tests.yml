name: Regression tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run synthetic regression tests
        run: node --test
